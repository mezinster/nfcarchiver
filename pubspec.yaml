name: nfc_archiver
description: "Distributed data archive on NFC tags - store and restore files across multiple NFC tags"
publish_to: 'none'

version: 1.1.1+14

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  intl: ^0.20.2
  shared_preferences: ^2.5.5

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.3

  # NFC
  nfc_manager: ^4.2.1

  # Bluetooth LE (Chameleon Ultra). BSD-3-Clause — flutter_blue_plus is NOT
  # an option: its licence is non-free and F-Droid would reject the app.
  flutter_reactive_ble: ^5.5.0

  # Navigation
  go_router: ^17.3.0

  # File Operations
  file_picker: ^11.0.3
  path_provider: ^2.1.6
  path: ^1.8.3
  share_plus: ^7.2.1
  mime: ^1.0.6
  package_info_plus: ^9.0.1

  # Crypto & Compression
  pointycastle: ^4.0.0
  archive: ^3.4.0

  # Utils
  uuid: ^4.2.1
  permission_handler: ^11.1.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

flutter:
  generate: true
  uses-material-design: true
